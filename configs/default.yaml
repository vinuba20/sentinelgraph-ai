random_state: 42
target_column: label
timestamp_column: timestamp
test_size: 0.2
validation_size: 0.2
time_split: true
model:
  n_estimators: 200
  max_depth: null
  min_samples_leaf: 1
  class_weight: balanced_subsample
  n_jobs: -1
tuning:
  # Enable this after verifying the dataset contract with a baseline run.
  enabled: false
  candidates:
    - max_depth: [null, 16]
      min_samples_leaf: [1, 4]
      max_features: [sqrt, 0.7]
